<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Edge">
  <meta name="description" content="The Daily Edge V2 — mobile sports analytics research dashboard.">
  <title>The Daily Edge V2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">DE</div>
        <div><div class="brand-name">THE DAILY EDGE</div><div class="brand-sub">V2 Research Intelligence</div></div>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh data">↻</button>
    </header>

    <main id="app" class="content" aria-live="polite">
      <section class="hero card hero-card">
        <div class="hero-top">
          <span id="modeBadge" class="badge testing">LIVE TESTING</span>
          <span id="updatedAt" class="muted tiny">Loading…</span>
        </div>
        <h1 id="heroTitle">Daily intelligence, one screen.</h1>
        <p id="heroSubtitle" class="muted">Loading the latest research bundle.</p>
        <div class="hero-stats">
          <div><span class="kicker">Qualified</span><strong id="qualifiedCount">—</strong></div>
          <div><span class="kicker">Watchlist</span><strong id="watchCount">—</strong></div>
          <div><span class="kicker">Sports</span><strong id="sportCount">—</strong></div>
        </div>
      </section>

      <div id="sportFilters" class="chips" aria-label="Sport filters"></div>

      <section id="view-home" class="view active"></section>
      <section id="view-picks" class="view"></section>
      <section id="view-combos" class="view"></section>
      <section id="view-performance" class="view"></section>
      <section id="view-system" class="view"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-btn" data-view="picks"><span>◎</span><small>Picks</small></button>
      <button class="nav-btn" data-view="combos"><span>◇</span><small>Combos</small></button>
      <button class="nav-btn" data-view="performance"><span>↗</span><small>Results</small></button>
      <button class="nav-btn" data-view="system"><span>⚙</span><small>System</small></button>
    </nav>
  </div>

  <div id="installSheet" class="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2>Save The Daily Edge</h2>
      <p id="installCopy" class="muted">Add this dashboard to your Home Screen for an app-like experience.</p>
      <button id="installBtn" class="primary-btn">Add to Home Screen</button>
      <button id="dismissInstall" class="text-btn">Not now</button>
    </div>
  </div>

  <template id="emptyTemplate"><div class="empty card"><strong>No qualified plays yet.</strong><p>Markets remain visible as research/watchlist items until validation gates are earned.</p></div></template>
  <script src="app.js" defer></script>
</body>
</html>
